[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-visual-archive"
version = "0.1.0"
description = "Local-first PowerPoint Visual Archive Viewer"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-pptx>=0.6.23",
    "pywin32>=306",
    "jinja2>=3.1",
    "Pillow>=10.0",
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
pptviewer = "ppt_visual_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
