scan_roots:
  - "D:/Slides"
  - "D:/Work/Presentations"

exclude_dirs:
  - ".git"
  - "__pycache__"
  - "~archive"
  - "node_modules"

exclude_patterns:
  - "~$*.pptx"

# File types to scan: "pptx", "pdf", or both
file_types:
  - "pptx"
  - "pdf"
  # - "md"  # opt in to local Markdown section snippets

output_dir: "D:/ppt-viewer-output"
db_path: "D:/ppt-viewer-output/data/index.db"

render:
  thumbnail_width: 320
  preview_width: 1280
  image_format: "jpg"
  jpeg_quality: 82
  # On macOS use PowerPoint AppleScript (temporary PDF only for rendering);
  # choose libreoffice explicitly if its different visual fidelity is acceptable.
  mac_pptx_backend: powerpoint
  pptx_conversion_timeout_seconds: 300
  markdown_offline_mode: false  # by default, public HTTPS Markdown images are imported when indexed

viewer:
  title: "PowerPoint Visual Archive"
  group_by_default: "day"

processing:
  incremental: true
  purge_deleted: true
